# Sourcery 规则保留清单（显式化"评论清零"的边界）。
# 2026-08-31 评审确认的保留项：
# - no-loop-in-tests / no-conditionals-in-tests：测试内循环/条件断言是惯用法
# 其余规则全开；新增触发点由 CI gate（sourcery-review-gate.yml）拦截。
version: '1'

ignore:
- .git
- env
- .env
- .tox
- node_modules
- vendor
- venv
- .venv
- dist
- coverage
- StrykerOutput
# awesome-rules 治理分发镜像（tools/git/install.sh --update 会整体覆盖刷新）：
# 本仓不拥有其代码演进，评审责任在 awesome-rules 仓，本仓评审豁免
- .lefthook
- commitlint.config.js
- .versionrc.js

rule_settings:
  enable:
  - default
  disable:
  - no-loop-in-tests
  - no-conditionals-in-tests
  # 2026-08-31 PR #11 追加豁免（依据：low-code-quality 是复杂度阈值建议，
  # 触发点全部为 dispatch/main 等主流程编排函数——复杂度是领域本质，
  # 强行拆分损害可读性；5 处逐一人工评估后豁免）。评审请确认。
  - low-code-quality
  rule_types:
  - refactoring
  - suggestion
  - comment
