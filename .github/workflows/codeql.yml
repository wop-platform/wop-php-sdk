name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '36 20 * * 6'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # 显式语言面：python 覆盖 .factory/*.py、actions 覆盖 workflow 自身。
        # 不含 php：CodeQL 无 PHP extractor（default setup 语言集无 php 同因）。
        # 不含 js-ts：仓库无真实 js 源码（coverage/html/_js 为构建产物），
        # default setup 的 js-ts 分析为空转。
        language: [python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
