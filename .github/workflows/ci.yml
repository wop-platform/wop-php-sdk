name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Portability gate (reject machine-specific absolute paths)
        run: bash .ci/portability-gate.sh

      - name: PHPDoc gate (src API docstring coverage)
        run: python3 scripts/docstring_gate.py

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, curl
          coverage: xdebug # pcov 无 path coverage 支持；xdebug 由 setup-php 预编译安装（runner 的 pecl 无 php_dir 写权限，必失败）

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Vector fixture integrity (byte-identical to protocol source)
        run: |
          if curl -fsSL --max-time 30 -o /tmp/crypto-vectors.json \
            https://raw.githubusercontent.com/wop-platform/gtsp-wop-gateway/main/docs/crypto-vectors.json; then
            cmp tests/fixtures/crypto-vectors.json /tmp/crypto-vectors.json
          else
            echo "::warning::真源不可达，跳过远端比对"
          fi

      - name: Interop fixture integrity (byte-identical to protocol source)
        run: |
          if curl -fsSL --max-time 30 -o /tmp/interop-cases.json \
            https://raw.githubusercontent.com/wop-platform/wop-specs/main/interop/v1/interop-cases.json; then
            cmp tests/fixtures/interop-cases.json /tmp/interop-cases.json
          else
            echo "::warning::真源不可达（wop-specs 未发布或网络受限），跳过远端比对"
          fi

      - name: Run tests with conformance vectors
        run: vendor/bin/phpunit

      - name: Coverage (xdebug path coverage, line + branch gate >= 98%)
        run: |
          XDEBUG_MODE=coverage php -d memory_limit=2G vendor/bin/phpunit \
            --path-coverage --coverage-php coverage/cov.php \
            --coverage-xml coverage/xml --coverage-html coverage/html
          php .ci/coverage-gate.php
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.php }}
          path: coverage/html
          retention-days: 7

  # 等价清单锚点漂移检测（wop-specs D7：清单行号随源码演进漂移须显性失败，
  # 防止等价主张静默指向错误对象）。秒级，每 PR 必跑。
  equivalent-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-equivalent-anchors.py
