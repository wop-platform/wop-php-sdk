name: Release

# 打 tag 即发布：Packagist 经 GitHub webhook 自动同步 tag（本仓无发布凭证、无发布步骤）。
# 本 workflow 仅做发布前验证：validate + install + 向量完整性 + phpunit 全绿。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag (composer validate / install / phpunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, curl
          coverage: none

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Vector fixture integrity (byte-identical to protocol source)
        run: |
          if curl -fsSL --max-time 30 -o /tmp/crypto-vectors.json \
            https://raw.githubusercontent.com/wop-platform/gtsp-wop-gateway/main/docs/crypto-vectors.json; then
            cmp tests/fixtures/crypto-vectors.json /tmp/crypto-vectors.json
          else
            echo "::warning::真源不可达，跳过远端比对"
          fi

      - name: Run tests with conformance vectors
        run: vendor/bin/phpunit


  create-release:
    name: Create GitHub Release object
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在（幂等跳过）"
            exit 0
          fi
          gh release create "$TAG" --verify-tag \
            --title "$TAG" \
            --notes "Tag 推送自动创建的 Release 对象（verify job 全绿后）。\n\n质量闭环与治理说明见 docs/wop-sdk-report-quality-gate.md；仓库首页徽章（github/v/release、packagist/v）依赖本对象与 Packagist 同步。"
